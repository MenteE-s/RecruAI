server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5M;

    # Security headers (mirror backend Talisman + VPS nginx)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    # HSTS only when serving HTTPS (uncomment behind TLS, or set via VPS nginx)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.recruai.menteeai.org wss://api.recruai.menteeai.org; media-src 'self' blob:; worker-src 'self' blob:; form-action 'self'" always;

    # Compress text assets (CRA bundles are JS-heavy; ~70% smaller on the wire).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_static on;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
