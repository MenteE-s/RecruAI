services:
  # Kafka (KRaft mode - no Zookeeper needed)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: recruai_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Kafka Topic Initializer
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: recruai_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "kafka-topics --create --topic recruai_events --bootstrap-server kafka:29092 --if-not-exists --partitions 1 --replication-factor 1"

  # PostgreSQL with pgvector
  db:
    image: pgvector/pgvector:0.7.0-pg15
    container_name: recruai_db
    environment:
      POSTGRES_USER: recruai
      POSTGRES_PASSWORD: recruai_pass
      POSTGRES_DB: recruai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: recruai_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ML Service (Embedding Generation via Gradio)
  mlservices:
    container_name: recruai_mlservices
    build:
      context: ./mlservices
      dockerfile: Dockerfile
    volumes:
      - ./mlservices:/app
    ports:
      - "7860:7860"
    networks:
      - recruai_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7860 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ngrok for exposing local dev server (webhook testing, demos)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: recruai_ngrok
    command: http backend:5000 --domain ${NGROK_DOMAIN:-}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      - backend
    networks:
      - recruai_network
    profiles:
      - ngrok
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  kafkadata:
