services:
  # PostgreSQL Database with pgvector
  db:
    image: pgvector/pgvector:0.7.0-pg15
    container_name: recruai_db
    environment:
      POSTGRES_USER: recruai
      POSTGRES_PASSWORD: recruai_pass
      POSTGRES_DB: recruai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recruai_network

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: recruai_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - recruai_network

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: recruai_kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recruai_network

  # Kafka Topic Initializer
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: recruai_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "kafka-topics --create --topic recruai_events --bootstrap-server kafka:29092 --if-not-exists --partitions 1 --replication-factor 1"
    networks:
      - recruai_network

  # Backend Flask API
  backend:
    container_name: recruai_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - /app/backend/__pycache__
      - /app/backend/.venv
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      FLASK_APP: backend.app
      FLASK_ENV: development
      DATABASE_URL: postgresql://recruai:recruai_pass@db:5432/recruai
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5000:5000"
    networks:
      - recruai_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React App
  frontend:
    container_name: recruai_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_BASE_URL=http://localhost:5000
        - REACT_APP_SOCKET_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_BASE_URL: http://localhost:5000
      REACT_APP_SOCKET_URL: http://localhost:5000
    networks:
      - recruai_network
    restart: unless-stopped

  # Redis Cache (optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: recruai_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - recruai_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ML Service (Embedding Generation via Gradio)
  mlservices:
    container_name: recruai_mlservices
    build:
      context: ./mlservices
      dockerfile: Dockerfile
    volumes:
      - ./mlservices:/app
    ports:
      - "7860:7860"
    networks:
      - recruai_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7860 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  redisdata:
  kafkadata:

networks:
  recruai_network:
    driver: bridge
