services:
  # DEV ONLY — do NOT use this file in prod (use docker-compose.vps.yml /
  # docker-compose.aws.yml). Ports are bound to 127.0.0.1 so LAN peers
  # cannot reach unauthenticated Redis/Postgres/Kafka.
  # Kafka (KRaft mode - no Zookeeper needed)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: recruai_kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Kafka Topic Initializer
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: recruai_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "kafka-topics --create --topic recruai_events --bootstrap-server kafka:29092 --if-not-exists --partitions 1 --replication-factor 1"

  # PostgreSQL with pgvector
  db:
    image: pgvector/pgvector:0.7.0-pg15
    container_name: recruai_db
    environment:
      POSTGRES_USER: recruai
      POSTGRES_PASSWORD: recruai_pass
      POSTGRES_DB: recruai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: recruai_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LiveKit SFU + TURN for local video-call dev (devkey/devsecret only —
  # production keys come from environment, see docker-compose.vps.yml).
  livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: recruai_livekit_dev
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/tcp"
      - "127.0.0.1:7882:7882/udp"
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:50000-50050:50000-50050/udp"
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - "0.0.0.0"
        rtc:
          tcp_port: 7881
          udp_port: 7882
          port_range_start: 50000
          port_range_end: 50050
          use_external_ip: false
        keys:
          devkey: devsecret0123456789abcdef0123456789ab
        redis:
          address: redis:6379
        room:
          empty_timeout: 300
          departure_timeout: 20
          max_participants: 4
        turn:
          enabled: true
          udp_port: 3478
          external_tls: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: the API itself, in Docker.
  #
  # The usual dev loop runs the API on the host from backend/.venv, which is
  # faster to reload and easier to step through, so this is behind a profile and
  # never starts unless asked:
  #   docker compose --profile app up -d --build backend
  #
  # DATABASE_URL and REDIS_URL are set explicitly rather than interpolated,
  # and they are literals on purpose.
  #
  # The root .env carries DB_NAME=recruai_dev, but the db service above
  # hardcodes POSTGRES_DB=recruai and the existing volume holds a database named
  # `recruai`. Interpolating ${DB_NAME} here silently produced a connection to a
  # database that has never existed, and the failure surfaced as a migration
  # crash rather than as a config mistake. Pinning to what db actually creates
  # removes the second source of truth.
  #
  # They are also overridden at all: backend/.env points at 127.0.0.1, which is
  # the host from the app's point of view but this container's own loopback.
  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: recruai_backend:dev
    container_name: recruai_migrate_dev
    restart: "no"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://recruai:recruai_pass@db:5432/recruai
      REDIS_URL: redis://redis:6379/0
      # Without this the Kafka client falls back to localhost:9092, which inside
      # the container is itself, and the logs fill with reconnect errors that
      # look like a fault but are only a missing env var.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_DEFAULT_TOPIC: recruai_events
    command: ["sh", "-c", "flask --app backend.app db upgrade --directory backend/migrations"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: recruai_backend:dev
    container_name: recruai_backend_dev
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 8000
      DATABASE_URL: postgresql+psycopg2://recruai:recruai_pass@db:5432/recruai
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_DEFAULT_TOPIC: recruai_events
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Forwarded-Proto: https' -o /dev/null http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # CVAI content: question bank -> quizzes -> projects. Idempotent, and behind
  # its own profile so it never runs on `up`:
  #   docker compose --profile seed run --rm cvai-seed
  cvai-seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: recruai_backend:dev
    container_name: recruai_cvai_seed_dev
    restart: "no"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://recruai:recruai_pass@db:5432/recruai
      REDIS_URL: redis://redis:6379/0
    command:
      - sh
      - -c
      - "python scripts/seed_skill_questions.py && python scripts/seed_quizzes.py && python scripts/seed_guided_projects.py"
    depends_on:
      db:
        condition: service_healthy

  # Recording worker for dev (bind-mounted so host backend can serve /uploads/recordings/*).
  egress:
    image: livekit/egress:v1.8.4
    container_name: recruai_egress_dev
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: devkey
        api_secret: devsecret0123456789abcdef0123456789ab
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        cpu_cost:
          room_composite_cpu_cost: 1
          track_composite_cpu_cost: 1
          track_cpu_cost: 0.5
        log_level: debug
    volumes:
      - ./backend/uploads/recordings:/recordings
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  kafkadata:
