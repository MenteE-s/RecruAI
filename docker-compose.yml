services:
  # DEV ONLY — do NOT use this file in prod (use docker-compose.vps.yml /
  # docker-compose.aws.yml). Ports are bound to 127.0.0.1 so LAN peers
  # cannot reach unauthenticated Redis/Postgres/Kafka.
  # Kafka (KRaft mode - no Zookeeper needed)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: recruai_kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Kafka Topic Initializer
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: recruai_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "kafka-topics --create --topic recruai_events --bootstrap-server kafka:29092 --if-not-exists --partitions 1 --replication-factor 1"

  # PostgreSQL with pgvector
  db:
    image: pgvector/pgvector:0.7.0-pg15
    container_name: recruai_db
    environment:
      POSTGRES_USER: recruai
      POSTGRES_PASSWORD: recruai_pass
      POSTGRES_DB: recruai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: recruai_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LiveKit SFU + TURN for local video-call dev (devkey/devsecret only —
  # production keys come from environment, see docker-compose.vps.yml).
  livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: recruai_livekit_dev
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/tcp"
      - "127.0.0.1:7882:7882/udp"
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:50000-50050:50000-50050/udp"
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - "0.0.0.0"
        rtc:
          tcp_port: 7881
          udp_port: 7882
          port_range_start: 50000
          port_range_end: 50050
          use_external_ip: false
        keys:
          devkey: devsecret0123456789abcdef0123456789ab
        redis:
          address: redis:6379
        room:
          empty_timeout: 300
          departure_timeout: 20
          max_participants: 4
        turn:
          enabled: true
          udp_port: 3478
          external_tls: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Recording worker for dev (bind-mounted so host backend can serve /uploads/recordings/*).
  egress:
    image: livekit/egress:v1.8.4
    container_name: recruai_egress_dev
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: devkey
        api_secret: devsecret0123456789abcdef0123456789ab
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        cpu_cost:
          room_composite_cpu_cost: 1
          track_composite_cpu_cost: 1
          track_cpu_cost: 0.5
        log_level: debug
    volumes:
      - ./backend/uploads/recordings:/recordings
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  kafkadata:
