# RecruAI AWS production stack — single EC2 + external RDS.
# Frontend lives on Vercel; this box runs API + Redis + Kafka + TLS.
# Database is RDS (no local db service). Secrets come from backend/.env.production,
# which the GitHub Actions deploy workflow regenerates from secrets on every deploy.
#
# First deploy is handled by the workflow (cert issuance ordering included).
# Manual equivalent:
#   API_DOMAIN=api.recruai.menteeai.org docker compose -f docker-compose.aws.yml up -d --build
#
# t3.small (2GB RAM) tunings: backend single worker, Kafka heap capped,
# Redis capped. Do not raise these without a bigger instance.

services:
  redis:
    image: redis:7-alpine
    container_name: recruai_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 192m

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: recruai_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    mem_limit: 512m

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: recruai_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "kafka-topics --create --topic recruai_events --bootstrap-server kafka:29092 --if-not-exists --partitions 1 --replication-factor 1"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruai_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      PORT: 8000
      FLASK_ENV: production
      IS_PRODUCTION: "1"
    # Single worker on the 2GB box (image default is -w 2, which starves Kafka).
    # NOTE: the factory target MUST be single-quoted — bare create_app()
    # parens are parsed as subshell syntax by sh and the container crash-loops.
    command: ["sh", "-c", "gunicorn -w 1 --threads 4 --bind 0.0.0.0:$${PORT:-8000} 'backend.app:create_app()'"]
    volumes:
      # Persist user/org uploads outside the container filesystem
      - backend_uploads:/app/backend/uploads
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    mem_limit: 768m

  nginx:
    image: nginx:1.25-alpine
    container_name: recruai_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in environment (e.g. api.recruai.menteeai.org)}
    volumes:
      # Rendered on container start via nginx's /etc/nginx/templates mechanism
      - ./nginx/nginx.vps.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    depends_on:
      backend:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    container_name: recruai_certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    # Webroot renewals (port 80 served by nginx). NOTE: nginx only reads certs
    # at start/reload, so the host runs a monthly cron to restart it:
    #   0 3 1 * * docker compose -f /opt/recruai/docker-compose.aws.yml restart nginx
    entrypoint: >
      sh -c "trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --quiet || true;
        sleep 12h & wait $${!};
      done;"

volumes:
  redisdata:
  kafkadata:
  backend_uploads:
  certbot_www:
  letsencrypt:
