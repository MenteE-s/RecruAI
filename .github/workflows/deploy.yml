name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Docs-only (or otherwise code-untouched) PRs skip CI entirely
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"

env:
  DOCKER_COMPOSE_FILE: docker-compose.aws.yml
  EC2_USER: ec2-user
  EC2_HOST: ${{ secrets.EC2_HOST }}
  DEPLOY_DIR: /opt/recruai
  API_DOMAIN: api.recruai.menteeai.org
  FRONTEND_ORIGIN: https://recruai.menteeai.org

jobs:
  # ===========================================================================
  # Validate — runs for every PR and every push to main, and deploy depends on
  # it. This is the test gate: a red backend or frontend test blocks the deploy.
  # NOTE: DB migration drift lives in check-migrations.yml.
  # ===========================================================================
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Pushing again to a PR cancels the stale run instead of billing twice.
    concurrency:
      group: validate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: pgvector/pgvector:0.7.0-pg15
        env:
          POSTGRES_USER: recruai
          POSTGRES_PASSWORD: recruai_pass
          POSTGRES_DB: recruai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recruai -d recruai_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://recruai:recruai_pass@localhost:5432/recruai_test
      TEST_DATABASE_SCHEMA: recruai_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Backend dependency audit
        run: python -m pip_audit -r backend/requirements.txt --strict

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:ci

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_API_BASE_URL: https://api.recruai.menteeai.org
          REACT_APP_SOCKET_URL: https://api.recruai.menteeai.org
        run: npm run build

      - name: Run Playwright E2E
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  # ===========================================================================
  # Deploy job — runs on push to main. Push code, it lands on EC2.
  # ===========================================================================
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          # Keep long-running steps (image builds, cert issuance) from being
          # killed as idle by NATs in the middle
          printf 'Host *\n  ServerAliveInterval 15\n  ServerAliveCountMax 4\n' > ~/.ssh/config

      - name: Verify SSH connection
        run: ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "echo 'Connected to $(hostname)'"

      - name: Bootstrap server prerequisites (idempotent, first run installs Docker)
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "bash -s" << 'BOOTEOF'
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            echo 'Installing Docker...'
            # NOTE: no 'curl' in this list — AL2023 preinstalls curl-minimal
            # and the full curl package conflicts with it. curl-minimal's
            # binary is sufficient for the download below.
            sudo dnf install -y docker git
            sudo systemctl enable --now docker
          fi
          if ! docker compose version >/dev/null 2>&1; then
            echo 'Installing Compose plugin...'
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -sSL "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi
          # Compose v5 needs buildx >= 0.17, but AL2023's docker package ships an
          # ancient one (0.12) — so check the VERSION, not just presence, and
          # remove stale copies that would shadow the new binary.
          NEED_BUILDX=0
          HAVE_BUILDX="$(docker buildx version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          if [ -z "$HAVE_BUILDX" ]; then
            NEED_BUILDX=1
          elif [ "$(printf '0.17.0\n%s' "$HAVE_BUILDX" | sort -V | head -1)" != "0.17.0" ]; then
            NEED_BUILDX=1
          fi
          if [ "$NEED_BUILDX" = "1" ]; then
            echo "Installing Buildx (have: ${HAVE_BUILDX:-none}, need >=0.17.0)..."
            BUILDX_VER="$(curl -fsSL https://api.github.com/repos/docker/buildx/releases/latest | jq -r .tag_name)"
            sudo curl -fsSL "https://github.com/docker/buildx/releases/download/${BUILDX_VER}/buildx-${BUILDX_VER}.linux-amd64" \
              -o /usr/local/lib/docker/cli-plugins/docker-buildx
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
            for p in "$HOME/.docker/cli-plugins/docker-buildx" /usr/lib/docker/cli-plugins/docker-buildx /usr/libexec/docker/cli-plugins/docker-buildx; do
              if [ -f "$p" ]; then sudo rm -f "$p"; fi
            done
          fi
          docker buildx version
          sudo usermod -aG docker ec2-user || true
          sudo mkdir -p /opt/recruai
          sudo chown -R ec2-user:ec2-user /opt/recruai
          if [ -z "$(swapon --show)" ]; then
            echo 'Creating 2GB swap (mandatory on 2GB box)...'
            sudo fallocate -l 2G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
          fi
          docker --version
          docker compose version
          BOOTEOF

      - name: Render production environment
        env:
          RDS_DATABASE_URL: ${{ secrets.RDS_DATABASE_URL }}
          API_DOMAIN: ${{ env.API_DOMAIN }}
          FRONTEND_ORIGIN: ${{ env.FRONTEND_ORIGIN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VIDEO_ENABLED: "0"
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_PUBLIC_URL: ${{ secrets.LIVEKIT_PUBLIC_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          # Write .env.production on the runner with printf, then ship it. This
          # avoids remote shell expansion of secret characters.
          bash scripts/render-production-env.sh

      - name: Sync code to EC2 (rsync)
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '.venv' \
            --exclude '*.pyc' \
            --exclude 'backend/.env' \
            --exclude 'frontend/.env' \
            --exclude 'frontend/build' \
            --exclude 'mlservices' \
            ./ ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:${{ env.DEPLOY_DIR }}/

      - name: Start infra (no backend yet — it needs the fresh schema first)
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            cd ${{ env.DEPLOY_DIR }} && \
            export API_DOMAIN=${{ env.API_DOMAIN }} && \
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} up -d --build redis kafka kafka-init
          "

      - name: Record previous backend image id
        id: previous-image
        run: |
          PREV_IMAGE_ID="$(ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} \
            'docker image inspect recruai_backend:latest --format "{{ .Id }}" 2>/dev/null || true')"
          echo "id=${PREV_IMAGE_ID}" >> "$GITHUB_OUTPUT"
          echo "PREV_IMAGE_ID=${PREV_IMAGE_ID}" >> "$GITHUB_ENV"
          if [[ -n "$PREV_IMAGE_ID" ]]; then
            echo "Previous backend image: ${PREV_IMAGE_ID}"
          else
            echo "No previous backend image found; rollback step will skip"
          fi

      - name: Pre-migration snapshot (optional S3 backup)
        env:
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          BACKUP_PREFIX: ${{ secrets.BACKUP_PREFIX || 'recruai' }}
        if: env.BACKUP_BUCKET != ''
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} \
            "cd ${{ env.DEPLOY_DIR }} && \
             source backend/.env.production && \
             BACKUP_BUCKET='${BACKUP_BUCKET}' BACKUP_PREFIX='${BACKUP_PREFIX}' \
             ./scripts/backup-db.sh"

      - name: Build backend image and tag deploy SHA
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            cd ${{ env.DEPLOY_DIR }} && \
            export API_DOMAIN=${{ env.API_DOMAIN }} && \
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} build backend && \
            docker tag recruai_backend:latest recruai_backend:${{ github.sha }}
          "

      - name: Run DB migrations
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            cd ${{ env.DEPLOY_DIR }} && \
            export API_DOMAIN=${{ env.API_DOMAIN }} && \
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm --no-deps backend \
              flask db --directory /app/backend/migrations upgrade
          "

      - name: Start backend, scheduler, and outbox worker
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            cd ${{ env.DEPLOY_DIR }} && \
            export API_DOMAIN=${{ env.API_DOMAIN }} && \
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} up -d --build backend scheduler outbox-worker
          "

      - name: Issue TLS cert on first boot (standalone, nginx stopped)
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            cd ${{ env.DEPLOY_DIR }} && export API_DOMAIN=${{ env.API_DOMAIN }} && \
            if docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} exec -T nginx test -f /etc/letsencrypt/live/${{ env.API_DOMAIN }}/fullchain.pem 2>/dev/null; then
              echo 'Cert already exists, skipping issuance'
            else
              echo 'No cert yet — issuing via standalone certbot on :80 (nginx not running yet)'
              # NOTE: --entrypoint override is required: the certbot service
              # defines a renew-loop entrypoint that would swallow 'certonly'.
              docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm --no-deps --entrypoint certbot -p 80:80 certbot \
                certonly --standalone --non-interactive --agree-tos --register-unsafely-without-email \
                -d ${{ env.API_DOMAIN }}
            fi
          "

      - name: Start nginx + certbot renew loop
        # restart (not just up): the nginx template is bind-mounted but only
        # RE-RENDERED at container start, so a plain 'up' would keep serving
        # the previous deploy's rendered config.
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            cd ${{ env.DEPLOY_DIR }} && \
            export API_DOMAIN=${{ env.API_DOMAIN }} && \
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} up -d --remove-orphans nginx certbot && \
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} restart nginx
          "

      - name: Wait for public HTTPS health (proves TLS + backend + RDS)
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://${{ env.API_DOMAIN }}/api/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy over public HTTPS!"
              break
            fi
            echo "Waiting for backend... (attempt $i, status $STATUS)"
            sleep 10
          done
          if [ "$STATUS" != "200" ]; then
            echo "Backend never became healthy — dumping logs"
            ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "cd ${{ env.DEPLOY_DIR }} && docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} logs --tail=100 backend nginx"
            exit 1
          fi

      - name: Rollback on failed deploy
        if: failure() && env.PREV_IMAGE_ID != ''
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} \
            "cd ${{ env.DEPLOY_DIR }} && \
             DEPLOY_DIR='${{ env.DEPLOY_DIR }}' \
             COMPOSE_FILE='${{ env.DOCKER_COMPOSE_FILE }}' \
             API_DOMAIN='${{ env.API_DOMAIN }}' \
             PREVIOUS_IMAGE_ID='${{ env.PREV_IMAGE_ID }}' \
             ./scripts/rollback-deploy.sh" || {
              echo 'Automatic rollback failed; follow docs/DEPLOY_RUNBOOK.md'
              exit 1
            }

      - name: Clean up old Docker images
        if: always() && !failure()
        # Dangling-only prune: '-a --filter until=' compares against image BUILD
        # date, so it deletes freshly-pulled upstream images (e.g. cp-kafka).
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "docker image prune -f" || true

      - name: Deployment success notification
        if: success()
        run: |
          echo "Deployed successfully at $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "   API: https://${{ env.API_DOMAIN }}/api/health"
          echo "   Commit: ${{ github.sha }}"
