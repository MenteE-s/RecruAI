name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Docs-only (or otherwise code-untouched) PRs skip CI entirely
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"

env:
  DOCKER_COMPOSE_FILE: docker-compose.aws.yml
  EC2_USER: ec2-user
  EC2_HOST: ${{ secrets.EC2_HOST }}
  DEPLOY_DIR: /opt/recruai
  API_DOMAIN: api.recruai.menteeai.org
  FRONTEND_ORIGIN: https://recruai.menteeai.org

jobs:
  # ===========================================================================
  # PR job — validate. Runs only for code PRs (see paths filter above).
  # NOTE: DB migration check lives in check-migrations.yml (no duplicate here).
  # ===========================================================================
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Pushing again to a PR cancels the stale run instead of billing twice
    concurrency:
      group: validate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import flask; print('Flask', flask.__version__)"

      - name: Validate frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ===========================================================================
  # Deploy job — runs on push to main. Push code, it lands on EC2.
  # ===========================================================================
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          # Keep long-running steps (image builds, cert issuance) from being
          # killed as idle by NATs in the middle
          printf 'Host *\n  ServerAliveInterval 15\n  ServerAliveCountMax 4\n' > ~/.ssh/config

      - name: Verify SSH connection
        run: ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "echo 'Connected to $(hostname)'"

      - name: Bootstrap server prerequisites (idempotent, first run installs Docker)
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "bash -s" << 'BOOTEOF'
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            echo 'Installing Docker...'
            # NOTE: no 'curl' in this list — AL2023 preinstalls curl-minimal
            # and the full curl package conflicts with it. curl-minimal's
            # binary is sufficient for the download below.
            sudo dnf install -y docker git
            sudo systemctl enable --now docker
          fi
          if ! docker compose version >/dev/null 2>&1; then
            echo 'Installing Compose plugin...'
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -sSL "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi
          # Compose v5 needs buildx >= 0.17, but AL2023's docker package ships an
          # ancient one (0.12) — so check the VERSION, not just presence, and
          # remove stale copies that would shadow the new binary.
          NEED_BUILDX=0
          HAVE_BUILDX="$(docker buildx version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          if [ -z "$HAVE_BUILDX" ]; then
            NEED_BUILDX=1
          elif [ "$(printf '0.17.0\n%s' "$HAVE_BUILDX" | sort -V | head -1)" != "0.17.0" ]; then
            NEED_BUILDX=1
          fi
          if [ "$NEED_BUILDX" = "1" ]; then
            echo "Installing Buildx (have: ${HAVE_BUILDX:-none}, need >=0.17.0)..."
            BUILDX_VER="$(curl -fsSL https://api.github.com/repos/docker/buildx/releases/latest | jq -r .tag_name)"
            sudo curl -fsSL "https://github.com/docker/buildx/releases/download/${BUILDX_VER}/buildx-${BUILDX_VER}.linux-amd64" \
              -o /usr/local/lib/docker/cli-plugins/docker-buildx
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
            for p in "$HOME/.docker/cli-plugins/docker-buildx" /usr/lib/docker/cli-plugins/docker-buildx /usr/libexec/docker/cli-plugins/docker-buildx; do
              if [ -f "$p" ]; then sudo rm -f "$p"; fi
            done
          fi
          docker buildx version
          sudo usermod -aG docker ec2-user || true
          sudo mkdir -p /opt/recruai
          sudo chown -R ec2-user:ec2-user /opt/recruai
          if [ -z "$(swapon --show)" ]; then
            echo 'Creating 2GB swap (mandatory on 2GB box)...'
            sudo fallocate -l 2G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
          fi
          docker --version
          docker compose version
          BOOTEOF

      - name: Sync code to EC2 (rsync)
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '.venv' \
            --exclude '*.pyc' \
            --exclude 'backend/.env' \
            --exclude 'frontend/.env' \
            --exclude 'frontend/build' \
            --exclude 'mlservices' \
            ./ ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:${{ env.DEPLOY_DIR }}/

      - name: Inject production environment
        env:
          RDS_DATABASE_URL: ${{ secrets.RDS_DATABASE_URL }}
        run: |
          # NOTE: inside containers, services resolve by compose service name
          # (redis://redis, kafka:29092) — never localhost/127.0.0.1.
          # VECTOR_DB_* are parsed out of RDS_DATABASE_URL so the RAG/recommender
          # modules point at RDS instead of their localhost defaults.
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} \
            "RDS_DATABASE_URL='${RDS_DATABASE_URL}' \
             API_DOMAIN='${{ env.API_DOMAIN }}' \
             FRONTEND_ORIGIN='${{ env.FRONTEND_ORIGIN }}' \
             SECRET_KEY='${{ secrets.SECRET_KEY }}' \
             JWT_SECRET_KEY='${{ secrets.JWT_SECRET_KEY }}' \
             GROQ_API_KEY='${{ secrets.GROQ_API_KEY }}' \
             OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}' \
             RESEND_API_KEY='${{ secrets.RESEND_API_KEY }}' \
             bash -s" << 'ENVEOF'
          set -euo pipefail
          URL="$RDS_DATABASE_URL"
          DB_USER="$(echo "$URL" | sed -E 's|.*://([^:]+):.*|\1|')"
          DB_PASS="$(echo "$URL" | sed -E 's|.*://[^:]+:([^@]+)@.*|\1|')"
          DB_HOST="$(echo "$URL" | sed -E 's|.*@([^:/]+).*|\1|')"
          DB_PORT="$(echo "$URL" | sed -E 's|.*@[^:/]+:?([0-9]*)/.*|\1|')"
          DB_PORT="${DB_PORT:-5432}"
          DB_NAME="$(echo "$URL" | sed -E 's|.*/([^/?]+).*|\1|')"
          cat > /opt/recruai/backend/.env.production << EOF2
          IS_PRODUCTION=1
          FLASK_ENV=production
          FLASK_DEBUG=0
          PORT=8000
          API_DOMAIN=$API_DOMAIN
          FRONTEND_ORIGIN=$FRONTEND_ORIGIN
          DATABASE_URL=$URL
          VECTOR_DB_HOST=$DB_HOST
          VECTOR_DB_PORT=$DB_PORT
          VECTOR_DB_NAME=$DB_NAME
          VECTOR_DB_USER=$DB_USER
          VECTOR_DB_PASSWORD=$DB_PASS
          SECRET_KEY=$SECRET_KEY
          JWT_SECRET_KEY=$JWT_SECRET_KEY
          GROQ_API_KEY=$GROQ_API_KEY
          OPENAI_API_KEY=$OPENAI_API_KEY
          RESEND_API_KEY=$RESEND_API_KEY
          REDIS_URL=redis://redis:6379/0
          REDIS_ENABLED=1
          RATELIMIT_STORAGE_URL=redis://redis:6379/0
          KAFKA_BOOTSTRAP_SERVERS=kafka:29092
          KAFKA_ENABLED=1
          KAFKA_DEFAULT_TOPIC=recruai_events
          RAG_ENABLED=1
          EMBEDDING_PROVIDER=huggingface
          EMBEDDING_DIMENSIONS=384
          AI_PROVIDER=groq
          AI_MODEL=groq/compound
          GROQ_MODEL=groq/compound
          JWT_TOKEN_LOCATION=headers
          JWT_COOKIE_SECURE=1
          JWT_COOKIE_SAMESITE=None
          JWT_COOKIE_CSRF_PROTECT=1
          JWT_ACCESS_TOKEN_EXPIRES_HOURS=2
          SESSION_COOKIE_SECURE=1
          ENABLE_HSTS=1
          ENABLE_AUDIT_LOG=1
          EOF2
          chmod 600 /opt/recruai/backend/.env.production
          echo "Wrote backend/.env.production"
          ENVEOF

      - name: Start infra + backend (no nginx yet on first boot)
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            cd ${{ env.DEPLOY_DIR }} && \
            export API_DOMAIN=${{ env.API_DOMAIN }} && \
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} up -d --build redis kafka kafka-init backend
          "

      - name: Issue TLS cert on first boot (standalone, nginx stopped)
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            cd ${{ env.DEPLOY_DIR }} && export API_DOMAIN=${{ env.API_DOMAIN }} && \
            if docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} exec -T nginx test -f /etc/letsencrypt/live/${{ env.API_DOMAIN }}/fullchain.pem 2>/dev/null; then
              echo 'Cert already exists, skipping issuance'
            else
              echo 'No cert yet — issuing via standalone certbot on :80 (nginx not running yet)'
              # NOTE: --entrypoint override is required: the certbot service
              # defines a renew-loop entrypoint that would swallow 'certonly'.
              docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} run --rm --no-deps --entrypoint certbot -p 80:80 certbot \
                certonly --standalone --non-interactive --agree-tos --register-unsafely-without-email \
                -d ${{ env.API_DOMAIN }}
            fi
          "

      - name: Start nginx + certbot renew loop
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            cd ${{ env.DEPLOY_DIR }} && \
            export API_DOMAIN=${{ env.API_DOMAIN }} && \
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} up -d nginx certbot
          "

      - name: Wait for public HTTPS health (proves TLS + backend + RDS)
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://${{ env.API_DOMAIN }}/api/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy over public HTTPS!"
              break
            fi
            echo "Waiting for backend... (attempt $i, status $STATUS)"
            sleep 10
          done
          if [ "$STATUS" != "200" ]; then
            echo "Backend never became healthy — dumping logs"
            ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "cd ${{ env.DEPLOY_DIR }} && docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} logs --tail=100 backend nginx"
            exit 1
          fi

      - name: Run DB migrations
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            cd ${{ env.DEPLOY_DIR }} && \
            export API_DOMAIN=${{ env.API_DOMAIN }} && \
            docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} exec -T backend flask db upgrade
          "

      - name: Clean up old Docker images
        if: always()
        # Dangling-only prune: '-a --filter until=' compares against image BUILD
        # date, so it deletes freshly-pulled upstream images (e.g. cp-kafka).
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "docker image prune -f" || true

      - name: Deployment success notification
        if: success()
        run: |
          echo "Deployed successfully at $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "   API: https://${{ env.API_DOMAIN }}/api/health"
          echo "   Commit: ${{ github.sha }}"
