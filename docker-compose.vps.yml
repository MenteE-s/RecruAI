# RecruAI single-VPS production stack (Lightsail etc.)
# Frontend stays on Vercel; this box runs API + Postgres + Redis + Kafka + TLS.
#
# Usage:
#   cp backend/.env.vps.example backend/.env.vps   # then fill secrets
#   docker compose -f docker-compose.vps.yml up -d --build
#
# Kafka is the heaviest service (~1GB). Toggle with KAFKA_ENABLED=0 in
# backend/.env.vps and `docker compose -f docker-compose.vps.yml stop kafka kafka-init`
# to reclaim RAM without touching code.

services:
  db:
    image: pgvector/pgvector:0.7.0-pg15
    container_name: recruai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-recruai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in environment}
      POSTGRES_DB: ${DB_NAME:-recruai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-recruai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: recruai_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: recruai_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: recruai_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "kafka-topics --create --topic recruai_events --bootstrap-server kafka:29092 --if-not-exists --partitions 1 --replication-factor 1"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruai_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.vps
    environment:
      PORT: 8000
    volumes:
      # Persist user/org uploads outside the container filesystem
      - backend_uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    container_name: recruai_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in environment (e.g. api.menteeai.org)}
    volumes:
      # Rendered on container start via nginx's /etc/nginx/templates mechanism
      - ./nginx/nginx.vps.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  kafkadata:
  backend_uploads:
  certbot_www:
  letsencrypt:
