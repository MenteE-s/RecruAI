# RecruAI single-VPS production stack (Lightsail etc.)
# Frontend stays on Vercel; this box runs API + Postgres + Redis + Kafka + TLS.
#
# Usage:
#   cp backend/.env.vps.example backend/.env.vps   # then fill secrets
#   docker compose -f docker-compose.vps.yml up -d --build
#
# Kafka is the heaviest service (~1GB). Toggle with KAFKA_ENABLED=0 in
# backend/.env.vps and `docker compose -f docker-compose.vps.yml stop kafka kafka-init`
# to reclaim RAM without touching code.

services:
  db:
    image: pgvector/pgvector:0.7.0-pg15@sha256:222c299a9f011679695414546c7f92ba0b0ba5aa4c8b7e3e33a4209c9b337832
    container_name: recruai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-recruai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in environment}
      POSTGRES_DB: ${DB_NAME:-recruai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-recruai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    container_name: recruai_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0@sha256:24cdd3a7fa89d2bed150560ebea81ff1943badfa61e51d66bb541a6b0d7fb047
    container_name: recruai_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0@sha256:24cdd3a7fa89d2bed150560ebea81ff1943badfa61e51d66bb541a6b0d7fb047
    container_name: recruai_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "kafka-topics --create --topic recruai_events --bootstrap-server kafka:29092 --if-not-exists --partitions 1 --replication-factor 1"

  # One-shot schema migration, run before the API starts.
  #
  # Its own service rather than an entrypoint inside backend, because with more
  # than one replica every container would run `db upgrade` at once, and a
  # half-applied schema is worse than a boot that refuses to start. backend waits
  # on this completing, so a failed migration stops the deploy instead of
  # serving traffic against a schema the code does not expect.
  #
  # All migrations, including the CVAI chain, are in the image. Run by hand:
  #   docker compose -f docker-compose.vps.yml run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: recruai_backend:latest
    container_name: recruai_migrate
    restart: "no"
    env_file:
      - ./backend/.env.vps
    command: ["sh", "-c", "flask --app backend.app db upgrade --directory backend/migrations"]
    depends_on:
      db:
        condition: service_healthy

  # CVAI content: skill question bank -> quizzes -> guided projects. Idempotent,
  # so it is safe to re-run, and behind a compose profile so it never fires
  # unattended on `up`:
  #   docker compose -f docker-compose.vps.yml --profile seed run --rm cvai-seed
  cvai-seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: recruai_backend:latest
    container_name: recruai_cvai_seed
    restart: "no"
    env_file:
      - ./backend/.env.vps
    command:
      - sh
      - -c
      - "python scripts/seed_skill_questions.py && python scripts/seed_quizzes.py && python scripts/seed_guided_projects.py && python scripts/seed_mock_interview_questions.py"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: recruai_backend:latest
    container_name: recruai_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.vps
    environment:
      PORT: 8000
    volumes:
      # Persist user/org uploads outside the container filesystem
      - backend_uploads:/app/backend/uploads
      # Call recordings written by the egress service (served at /uploads/recordings/*)
      - recordings:/app/backend/uploads/recordings
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Forwarded-Proto: https' -o /dev/null http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # Exactly one scheduler process (see docker-compose.aws.yml for why the API
  # must never start APScheduler itself).
  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: recruai_backend:latest
    container_name: recruai_scheduler
    restart: unless-stopped
    env_file:
      - ./backend/.env.vps
    command: ["python", "-m", "backend.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy

  # Outbox worker: delivers queued email/Kafka/notifications with retries.
  # Two parallel claim loops per process; raise OUTBOX_WORKERS on bigger hosts.
  outbox-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: recruai_backend:latest
    container_name: recruai_outbox_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env.vps
    environment:
      OUTBOX_WORKERS: "2"
      OUTBOX_BATCH_SIZE: "25"
      OUTBOX_POLL_INTERVAL: "2"
    command: ["python", "-m", "backend.outbox_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy

  # Self-hosted video (LiveKit SFU + TURN + recording egress).
  # Firewall must allow: TCP 7881, TCP+UDP 7882, TCP+UDP 3478, UDP 50000-50050.
  # Signaling reaches browsers as wss://<API_DOMAIN>/livekit/ via nginx.
  livekit:
    image: livekit/livekit-server:v1.8.4@sha256:621fd87bd64a0c83e1f2418ee0323eb920d00acdd73e5f79b303c64f6cc532af
    container_name: recruai_livekit
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "7881:7881/tcp" # ICE/TCP fallback
      - "7882:7882/tcp" # ICE/TCP multiplex
      - "7882:7882/udp" # ICE/UDP multiplex
      - "3478:3478/tcp" # TURN/TCP
      - "3478:3478/udp" # TURN/UDP
      - "50000-50050:50000-50050/udp" # WebRTC media
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - "0.0.0.0"
        rtc:
          tcp_port: 7881
          udp_port: 7882
          port_range_start: 50000
          port_range_end: 50050
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in environment}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in environment}
        # Egress state + multi-node coordination live here (server panics
        # on egress API calls without it).
        redis:
          address: redis:6379
        room:
          empty_timeout: 300
          departure_timeout: 20
          max_participants: 4
        turn:
          enabled: true
          udp_port: 3478
          external_tls: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Recording worker: room-composite MP4 -> /recordings (max 2 concurrent by config).
  egress:
    image: livekit/egress:v1.8.4@sha256:b66a3b1efb18a68e85d1cf1b6fc818018beb47475acbe8c282be353e2ab37f75
    container_name: recruai_egress
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in environment}
        api_secret: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in environment}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        cpu_cost:
          room_composite_cpu_cost: 1
          track_composite_cpu_cost: 1
          track_cpu_cost: 0.5
        log_level: debug
    volumes:
      - recordings:/recordings
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: recruai_nginx
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint-vps.sh"]
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./backend/.env.vps
    volumes:
      - ./nginx/entrypoint-vps.sh:/entrypoint-vps.sh:ro
      - ./nginx/nginx.vps.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  kafkadata:
  backend_uploads:
  recordings:
  certbot_www:
  letsencrypt:
